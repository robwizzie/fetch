name: CI

on:
  push:
  pull_request:

jobs:
  smoke-test:
    name: Headless smoke test (Godot 4.7.2)
    runs-on: ubuntu-latest
    env:
      GODOT_VERSION: 4.7.2
    steps:
      - uses: actions/checkout@v4

      - name: Download Godot
        run: |
          curl -sSL -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip
          mv Godot_v${GODOT_VERSION}-stable_linux.x86_64 godot
          chmod +x godot
          ./godot --version

      - name: Import project
        # Two passes: the first imports the font files, the second lets the theme that references
        # them load cleanly (otherwise the log fills with harmless "non-existent resource" errors).
        run: |
          ./godot --headless --path . --import
          ./godot --headless --path . --import

      - name: Run smoke test
        run: ./godot --headless --path . res://tests/smoke_test.tscn

      - name: Check gameplay mechanics
        run: ./godot --headless --path . res://tests/gameplay_test.tscn

      - name: Check menu and loading flow
        run: ./godot --headless --path . res://tests/ui_flow_test.tscn

      - name: Check weapons, placement and camera
        run: |
          ./godot --headless --path . res://tests/weapon_test.tscn
          ./godot --headless --path . res://tests/match_rules_test.tscn
          ./godot --headless --path . res://tests/camera_test.tscn
          ./godot --headless --path . res://tests/mixed_match_test.tscn

      - name: Check authored 3D asset pipeline
        run: ./godot --headless --path . res://tests/asset_pipeline_test.tscn
